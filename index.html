<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>AI Legal Advisor</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}textarea{width:100%;padding:.5rem}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px;margin-top:.5rem}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>⚖️ AI Legal Advisor</h1><p>Paste a contract clause for a quick risk check. (Informational only — not legal advice.)</p><textarea id="c" rows="4" placeholder="Paste clause text..."></textarea><br><button onclick="go()">Analyze clause</button><div id="out"></div><script>function go(){const c=document.getElementById('c').value.toLowerCase();const flags=[];if(/unlimited liability|indemnif/.test(c))flags.push('🔴 Unlimited liability / broad indemnification');if(/termination for convenience/.test(c))flags.push('🟡 Termination for convenience — check notice period');if(/auto-?renew/.test(c))flags.push('🟡 Auto-renewal — calendar the opt-out date');if(/penalt|liquidated damages/.test(c))flags.push('🔴 Penalty/liquidated damages clause');if(/confidential/.test(c))flags.push('🟢 Confidentiality clause present (good)');document.getElementById('out').textContent=flags.length?flags.join('\n'):'No common risk patterns detected.';document.getElementById('out').textContent+='\n\nFull AI contract review with redlining: commercial@ziontechgroup.com'}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/ai-legal-advisor">GitHub</a> · <a href="https://ziontechgroup.com/zion-ai-contract-reviewer/">Contract Reviewer</a></p></body></html>
